<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шпаргалка по динамике</title>
<style>
:root{color-scheme:light;--bg:linear-gradient(135deg,#fdfbf7,#ffffff);--s:#ffffff;--t:#1d1a2b;--p:#EA5701;--on:#ffffff;--o:#FFF6E3;--l:#D2E660;--v:#FFCCEA;--g:#FFCA27;--in:#FFF9F0;--line:#E8D5C4;--f:system-ui,-apple-system,sans-serif;--r:24px;--rb:30px;--up:uppercase}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:17px/1.5 var(--f);padding:20px 12px}
#app{max-width:960px;margin:auto;background:var(--s);border-radius:calc(var(--r) + 4px);padding:clamp(16px,4vw,34px);color:var(--t)}
#app *{color:inherit}#app h1{color:var(--hc,var(--p));font-size:clamp(40px,9vw,92px);line-height:.92;letter-spacing:-.05em;font-weight:900;text-transform:var(--up);margin:28px 0 16px;max-width:85%}
#app h2{font-size:clamp(23px,4vw,34px);line-height:1.1;margin:8px 0}#app h3{font-size:20px;margin:0 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;font:800 13px/1.3 var(--f);text-transform:uppercase}
button{cursor:pointer;border:0;border-radius:var(--rb);padding:12px 18px;background:var(--p);color:var(--on)!important;font:700 15px var(--f);min-height:44px;margin:4px 4px 4px 0}
button.a{background:var(--g);color:var(--t)!important}
.hero{position:relative}.hero p{max-width:470px;font-weight:600}.blob{position:absolute;right:4%;bottom:0;width:100px;height:100px;background:radial-gradient(circle at 30% 25%,#fff9,var(--o) 60%);border-radius:45% 55% 62% 38%;box-shadow:14px 8px 0 var(--l)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.tile{border-radius:var(--r);padding:22px}.tile>b{display:block;font-size:clamp(20px,3vw,30px);line-height:1.1}
.or{background:var(--o);grid-row:span 2}.gr{background:var(--g)}.li{background:var(--l)}.pu{background:var(--p);color:var(--on)!important}.pu *{color:var(--on)!important}.wide{grid-column:1/-1}
input,textarea{width:100%;font:inherit;border:2px solid var(--line);background:var(--in);color:var(--t)!important;border-radius:calc(var(--r)*.65);padding:13px 15px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 16px}.chips button{min-height:36px;padding:8px 14px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:140px;border-radius:calc(var(--r) - 2px);padding:18px;margin:0;color:var(--t)!important;font:800 19px/1.2 var(--f)}
.card small{font:700 12px var(--f);opacity:.7}.card i{font-style:normal;text-align:right;font-size:24px}
.card:nth-child(4n+1){background:var(--v)}.card:nth-child(4n+2){background:var(--g)}.card:nth-child(4n+3){background:var(--l)}.card:nth-child(4n){background:var(--o)}
.pan{background:var(--g);border-radius:calc(var(--r) - 2px);padding:20px;margin:12px 0}.box{background:var(--v);border-radius:calc(var(--r)*.6);padding:13px 15px;margin:10px 0}
.ok{background:#d9f7e3}.no{background:#ffe1d6}.ok,.no,.ok *,.no *{color:#1d1a2b!important}.o{display:block;width:100%;text-align:left;background:var(--in);color:var(--t)!important;border:2px solid var(--line);border-radius:calc(var(--r)*.6);font-weight:600}
.pan button.a{background:var(--s)}.mut{font-size:13px;opacity:.65}.foot{text-align:center;font-size:12px;opacity:.6;margin-top:24px}
@media(max-width:560px){body{padding:8px}.blob{width:60px;height:60px;opacity:.85}.hero p{max-width:72%}.tile{padding:15px}.card{min-height:120px;padding:13px;font-size:16px}}
</style></head><body><main id="app"></main>
<script>
const TITLE="Шпаргалка по динамике",SUB="Найди свою ошибку, разберись по шагам и проверь себя.",CLS="10 класс профиль";
const DATA=[
{cat:"Импульс и ЗСИ",q:"Забыл знак проекции импульса",src:1,e:"<b>p⃗ = mv⃗; проекция pₓ = mv·cosα.</b> Знак проекции зависит от направления вектора скорости относительно выбранной оси.",ex:"Тело движется влево со скоростью 5 м/с, ось X направлена вправо. pₓ = m·(-5).",st:["Выбери положительное направление оси","Определи знак проекции скорости","Умножь массу на проекцию скорости"],c:["Проверь направление вектора скорости","Сравни знак с направлением оси X"],help:["Вектор скорости и ось X направлены в разные стороны → знак минус.","Пример: v = -10 м/с, m = 2 кг, pₓ = -20 кг·м/с.","Частая ошибка: складывать модули импульсов вместо векторного сложения."],t:[{y:"choice",q:"Тело массой 2 кг движется влево со скоростью 3 м/с. Ось X направлена вправо. Чему равна проекция импульса?",o:["6 кг·м/с","-6 кг·м/с","0"],a:1,h:"Скорость направлена против оси X.",s:"pₓ = m·vₓ = 2·(-3) = -6 кг·м/с."},{y:"input",q:"Чему равен модуль импульса тела массой 5 кг, движущегося со скоростью 4 м/с?",a:["20"],h:"Модуль импульса p = m·v.",s:"p = 5·4 = 20 кг·м/с."},{y:"open",q:"Почему при векторном сложении импульсов нельзя просто складывать их модули?",a:"Импульс — векторная величина, его направление имеет значение.",h:"Вспомни правило сложения векторов.",s:"Векторы складываются по правилу треугольника или параллелограмма, а не как скаляры."}]},
{cat:"Импульс и ЗСИ",q:"Путаю импульс тела и импульс силы",src:1,e:"<b>Импульс силы F⃗·Δt = Δp⃗.</b> Изменение импульса тела равно импульсу действующей силы.",ex:"Сила 10 Н действовала 2 с. Δp = 10·2 = 20 Н·с.",st:["Запиши начальное значение импульса","Вычисли импульс силы F·Δt","Сложи векторы: p⃗₁ = p⃗₀ + F⃗·Δt"],c:["Проверь единицы измерения (Н·с или кг·м/с)","Убедись, что учтён знак силы"],help:["Импульс силы — это причина изменения импульса тела.","Пример: F = 5 Н, t = 3 с, Δp = 15 кг·м/с.","Частая ошибка: путать размерность импульса тела (кг·м/с) и работы (Дж)."],t:[{y:"choice",q:"Какая величина равна изменению импульса тела?",o:["Работа силы","Импульс силы","Мощность силы"],a:1,h:"Вспомни второй закон Ньютона в импульсной форме.",s:"Δp⃗ = F⃗·Δt — это импульс силы."},{y:"input",q:"Сила 20 Н действовала на тело 0,5 с. Чему равно изменение импульса тела (в кг·м/с)?",a:["10"],h:"Δp = F·Δt.",s:"Δp = 20·0,5 = 10 кг·м/с."},{y:"open",q:"Объясни, почему при упругом ударе о стенку изменение импульса шарика равно 2mv, а не 0.",a:"Скорость меняет знак, Δv = v - (-v) = 2v.",h:"Начальная и конечная скорости направлены противоположно.",s:"p₁ = mv, p₂ = -mv, Δp = p₂ - p₁ = -mv - mv = -2mv. Модуль равен 2mv."}]},
{cat:"Центр масс",q:"Не знаю, как найти скорость ЦМ",src:1,e:"<b>v⃗ц = Σmᵢv⃗ᵢ / M.</b> Скорость центра масс системы равна векторной сумме импульсов, деленной на общую массу.",ex:"Два шара: m₁=1кг, v₁=2м/с; m₂=2кг, v₂=-1м/с. vц = (1·2 + 2·(-1)) / 3 = 0.",st:["Запиши массы и проекции скоростей всех тел","Найди сумму произведений mᵢ·vᵢₓ","Раздели результат на общую массу M"],c:["Проверь знаки проекций скоростей","Убедись, что в знаменателе сумма всех масс"],help:["Центр масс движется так, как будто вся масса сосредоточена в этой точке.","Пример: m₁=2, v₁=3; m₂=1, v₂=0. vц = (2·3 + 1·0)/3 = 2 м/с.","Частая ошибка: делить на количество тел, а не на общую массу."],t:[{y:"choice",q:"Чему равна скорость центра масс двух одинаковых шаров, движущихся навстречу друг другу с одинаковой скоростью v?",o:["v","0","2v"],a:1,h:"Их импульсы равны по модулю и противоположны по направлению.",s:"p₁ + p₂ = mv + (-mv) = 0, значит vц = 0."},{y:"input",q:"Тело массой 3 кг движется со скоростью 4 м/с, а тело массой 1 кг покоится. Чему равна скорость их центра масс (в м/с)?",a:["3"],h:"vц = (m₁v₁ + m₂v₂) / (m₁ + m₂).",s:"vц = (3·4 + 1·0) / (3 + 1) = 12 / 4 = 3 м/с."},{y:"open",q:"Почему центр масс системы «человек + лодка» остаётся на месте при движении человека по лодке в спокойной воде?",a:"Сумма внешних сил равна нулю, импульс системы сохраняется.",h:"Вспомни закон сохранения импульса для замкнутой системы.",s:"Внешние силы (тяжести и Архимеда) скомпенсированы, трения о воду нет, значит vц = 0."}]},
{cat:"Момент импульса",q:"Путаю момент силы и момент импульса",src:1,e:"<b>Момент силы M = F·h, момент импульса L = I·ω.</b> Момент импульса характеризует вращательное движение, как импульс — поступательное.",ex:"Диск I = 2 кг·м², ω = 3 рад/с. L = 2·3 = 6 кг·м²/с.",st:["Определи момент инерции I тела","Найди угловую скорость ω","Умножь I на ω для получения L"],c:["Проверь единицы: кг·м²/с","Убедись, что ω в рад/с, а не в об/мин"],help:["Момент силы вызывает изменение момента импульса: M·Δt = ΔL.","Пример: I = 0,5, ω = 4, L = 2.","Частая ошибка: использовать формулу импульса p=mv вместо L=Iω."],t:[{y:"choice",q:"Как изменится момент импульса, если угловая скорость увеличится в 2 раза, а момент инерции не изменится?",o:["Уменьшится в 2 раза","Не изменится","Увеличится в 2 раза"],a:2,h:"L прямо пропорционален ω при постоянном I.",s:"L = I·ω, значит при ω → 2ω, L → 2L."},{y:"input",q:"Момент инерции тела 5 кг·м², угловая скорость 4 рад/с. Чему равен момент импульса?",a:["20"],h:"L = I·ω.",s:"L = 5·4 = 20 кг·м²/с."},{y:"open",q:"Почему фигурист вращается быстрее, когда прижимает руки к телу?",a:"Момент инерции уменьшается, а момент импульса сохраняется, поэтому ω растёт.",h:"Вспомни закон сохранения момента импульса: I₁ω₁ = I₂ω₂.",s:"При прижатии рук I уменьшается, чтобы L осталось прежним, ω должна увеличиться."}]},
{cat:"Момент импульса",q:"Забываю ЗС момента импульса",src:1,e:"<b>Если ΣM = 0, то I₁ω₁ = I₂ω₂.</b> При отсутствии внешних моментов сил момент импульса замкнутой системы сохраняется.",ex:"I₁ = 4, ω₁ = 2. Сжали руки, I₂ = 2. Тогда ω₂ = 4·2 / 2 = 4 рад/с.",st:["Убедись, что сумма моментов внешних сил равна 0","Запиши I₁·ω₁ = I₂·ω₂","Вырази неизвестную величину"],c:["Проверь, что все величины в СИ","Сравни начальный и конечный моменты инерции"],help:["ЗС момента импульса работает аналогично ЗСИ для поступательного движения.","Пример: I уменьшился в 3 раза, значит ω увеличится в 3 раза.","Частая ошибка: применять ЗС момента импульса, когда есть внешнее трение."],t:[{y:"choice",q:"Человек на вращающейся скамье разводит руки в стороны. Что происходит с угловой скоростью?",o:["Увеличивается","Уменьшается","Не меняется"],a:1,h:"Разводя руки, человек увеличивает момент инерции.",s:"I увеличивается, значит ω должна уменьшиться, чтобы I·ω = const."},{y:"input",q:"Момент инерции уменьшился в 4 раза. Во сколько раз увеличилась угловая скорость?",a:["4"],h:"I₁ω₁ = I₂ω₂. Если I₂ = I₁/4, то ω₂ = ?",s:"I₁ω₁ = (I₁/4)·ω₂ ⇒ ω₂ = 4ω₁."},{y:"open",q:"Можно ли применить ЗС момента импульса к планете, движущейся по эллиптической орбите вокруг Солнца?",a:"Да, потому что сила гравитации центральная и её момент относительно Солнца равен 0.",h:"Вспомни определение момента силы: M = F·h.",s:"Плечо силы гравитации относительно центра Солнца равно 0, значит M = 0, и L = const."}]},
{cat:"Работа и мощность",q:"Считаю работу упругости как F·x",src:1,e:"<b>Работа переменной силы упругости A = kx²/2.</b> Для постоянной силы A = F·s·cosα. Работа равна площади под графиком F(x).",ex:"Пружина k=100 Н/м сжата на 0,1 м. A = 100·0,01 / 2 = 0,5 Дж.",st:["Определи, постоянная сила или переменная","Для упругости используй A = kx²/2","Проверь знак: сила упругости совершает положительную работу при распрямлении"],c:["Проверь единицы: x в метрах, k в Н/м","Убедись, что x — это изменение длины, а не сама длина"],help:["Сила упругости меняется от 0 до kx, поэтому берётся среднее значение или площадь треугольника.","Пример: k=200, x=0,2. A = 200·0,04/2 = 4 Дж.","Частая ошибка: не переводить сантиметры в метры."],t:[{y:"choice",q:"Чему равна работа силы упругости при растяжении пружины от 0 до x?",o:["kx","kx²/2","kx²"],a:1,h:"Работа равна площади треугольника под графиком F(x).",s:"Площадь = (основание · высота) / 2 = (x · kx) / 2 = kx²/2."},{y:"input",q:"Пружину жесткостью 200 Н/м растянули на 5 см. Чему равна работа силы упругости (в Дж)?",a:["0.25","0,25"],h:"Переведи 5 см в 0,05 м. A = kx²/2.",s:"A = 200·(0,05)² / 2 = 200·0,0025 / 2 = 0,25 Дж."},{y:"open",q:"Почему работа силы тяжести при подъеме тела отрицательна?",a:"Угол между вектором силы тяжести (вниз) и перемещением (вверх) равен 180°, cos180° = -1.",h:"Вспомни формулу A = F·s·cosα.",s:"Сила направлена вниз, перемещение вверх, значит работа отрицательна."}]},
{cat:"Работа и мощность",q:"Путаю мощность и работу",src:1,e:"<b>Мощность N = A/Δt = F·v.</b> Мощность показывает, как быстро совершается работа.",ex:"Двигатель совершил работу 1000 Дж за 2 с. N = 1000 / 2 = 500 Вт.",st:["Определи совершенную работу A или силу F и скорость v","Раздели работу на время или умножь силу на скорость","Переведи результат в Вт или кВт"],c:["Проверь единицы: 1 Вт = 1 Дж/с","Убедись, что скорость в м/с, а не в км/ч"],help:["Мощность — это скорость совершения работы.","Пример: F=10 Н, v=5 м/с, N = 10·5 = 50 Вт.","Частая ошибка: путать Вт и Дж, забывая делить на время."],t:[{y:"choice",q:"В каких единицах измеряется мощность?",o:["Джоуль","Ватт","Ньютон"],a:1,h:"Мощность — это работа, деленная на время.",s:"[N] = Дж/с = Вт."},{y:"input",q:"Кран поднимает груз силой 5000 Н со скоростью 2 м/с. Какова полезная мощность крана (в кВт)?",a:["10"],h:"N = F·v. Переведи Вт в кВт.",s:"N = 5000·2 = 10000 Вт = 10 кВт."},{y:"open",q:"Почему автомобиль на подъеме в гору должен переключаться на пониженную передачу?",a:"При постоянной мощности двигателя уменьшение скорости позволяет увеличить силу тяги (N = F·v).",h:"Вспомни связь мощности, силы и скорости.",s:"Чтобы увеличить F при неизменной N, нужно уменьшить v."}]},
{cat:"Энергия",q:"Путаю теорему о Eк с ЗСМЭ",src:1,e:"<b>A всех сил = ΔEк.</b> Работа равнодействующей силы равна изменению кинетической энергии тела.",ex:"Тело разогнали из покоя, совершив работу 50 Дж. Eк стала равна 50 Дж.",st:["Запиши начальную кинетическую энергию Eк₀","Запиши конечную кинетическую энергию Eк","Найди разность: A = Eк - Eк₀"],c:["Проверь, что скорость в м/с","Убедись, что Eк не может быть отрицательной"],help:["Теорема о кинетической энергии верна всегда, даже при наличии трения.","Пример: m=2, v=3. Eк = 2·9/2 = 9 Дж.","Частая ошибка: забывать квадрат скорости в формуле Eк = mv²/2."],t:[{y:"choice",q:"Как изменится кинетическая энергия тела, если его скорость увеличится в 2 раза?",o:["Увеличится в 2 раза","Увеличится в 4 раза","Не изменится"],a:1,h:"Eк пропорциональна квадрату скорости.",s:"Eк = m(2v)²/2 = 4·(mv²/2), значит увеличится в 4 раза."},{y:"input",q:"Тело массой 4 кг движется со скоростью 3 м/с. Чему равна его кинетическая энергия (в Дж)?",a:["18"],h:"Eк = mv²/2.",s:"Eк = 4·3²/2 = 4·9/2 = 18 Дж."},{y:"open",q:"Почему тормозной путь автомобиля пропорционален квадрату скорости?",a:"По теореме о кинетической энергии: Aтр = -μmgl = 0 - mv²/2, откуда l = v²/(2μg).",h:"Приравняй работу силы трения к изменению кинетической энергии.",s:"Работа силы трения гасит всю кинетическую энергию, которая зависит от v²."}]},
{cat:"Энергия",q:"Путаю потенциальные и непотенциальные силы",src:1,e:"<b>Потенциальные силы: тяжесть, упругость, гравитация.</b> Их работа не зависит от формы пути и по замкнутому контуру равна 0. Сила трения — непотенциальная.",ex:"Работа силы тяжести при подъеме и спуске на ту же высоту равна 0.",st:["Определи вид силы","Если сила консервативная, используй A = -ΔEп","Если есть трение, учитывай его работу отдельно"],c:["Проверь, зависит ли работа силы от формы траектории","Убедись, что для силы трения работа по замкнутому пути ≠ 0"],help:["Потенциальная энергия вводится только для консервативных сил.","Пример: работа силы тяжести зависит только от разности высот.","Частая ошибка: пытаться ввести потенциальную энергию для силы трения."],t:[{y:"choice",q:"Какая из перечисленных сил является потенциальной?",o:["Сила трения","Сила упругости","Сила сопротивления воздуха"],a:1,h:"Работа потенциальной силы не зависит от формы пути.",s:"Сила упругости — консервативная, её работа по замкнутому пути равна 0."},{y:"input",q:"Тело массой 2 кг подняли на высоту 5 м. Чему равно изменение потенциальной энергии (в Дж)? g=10 м/с².",a:["100"],h:"ΔEп = mgh.",s:"ΔEп = 2·10·5 = 100 Дж."},{y:"open",q:"Может ли потенциальная энергия быть отрицательной?",a:"Да, если тело находится ниже выбранного нулевого уровня потенциальной энергии.",h:"Вспомни, что нулевой уровень выбирается произвольно.",s:"Если нуль на столе, а тело на полу, его Eп = -mgh."}]},
{cat:"ЗСМЭ",q:"Забываю про непотенциальные силы",src:1,e:"<b>Если Aнепот = 0, то Eк + Eп = const.</b> Если есть трение, то Aнепот = ΔE = ΔEк + ΔEп.",ex:"Шайба скользит по льду с трением. Eк уменьшается, переходя во внутреннюю энергию.",st:["Проверь, есть ли силы трения или сопротивления","Если нет, запиши Eк₁ + Eп₁ = Eк₂ + Eп₂","Если есть, добавь работу непотенциальных сил: Aнепот = E₂ - E₁"],c:["Убедись, что учтены все виды энергии","Проверь знаки: работа силы трения всегда отрицательна"],help:["ЗСМЭ выполняется только в замкнутой системе без диссипативных сил.","Пример: падение в вакууме — Eк+Eп=const. Падение в воздухе — E уменьшается.","Частая ошибка: применять ЗСМЭ при наличии трения без учета его работы."],t:[{y:"choice",q:"При свободном падении тела в вакууме его полная механическая энергия:",o:["Увеличивается","Уменьшается","Не изменяется"],a:2,h:"Действует только сила тяжести — консервативная сила.",s:"В отсутствие сопротивления воздуха Eк + Eп = const."},{y:"input",q:"Тело бросили вертикально вверх со скоростью 10 м/с. На какой высоте его скорость станет 0? (g=10 м/с²)",a:["5"],h:"Используй ЗСМЭ: mv²/2 = mgh.",s:"h = v²/(2g) = 100/20 = 5 м."},{y:"open",q:"Куда исчезает механическая энергия при торможении автомобиля?",a:"Она переходит во внутреннюю энергию (нагревание тормозных колодок и дороги) из-за работы силы трения.",h:"Вспомни, что сила трения — непотенциальная.",s:"Работа силы трения отрицательна, она уменьшает полную механическую энергию системы."}]},
{cat:"Космические скорости",q:"Путаю 2-ю и 3-ю космические",src:1,e:"<b>v₂ = √(2GM/R) ≈ 11,2 км/с</b> — чтобы покинуть Землю. <b>v₃ ≈ 16,7 км/с</b> — чтобы покинуть Солнечную систему.",ex:"Для запуска межпланетной станции нужна скорость не менее v₂.",st:["Определи, какую систему нужно покинуть","Для Земли используй v₂ = 11,2 км/с","Для Солнечной системы используй v₃ = 16,7 км/с"],c:["Проверь, о какой системе идет речь","Убедись, что v₃ > v₂"],help:["Вторая космическая скорость — параболическая, траектория — парабола.","Третья космическая скорость учитывает движение Земли вокруг Солнца.","Частая ошибка: думать, что v₃ нужна для выхода на орбиту Земли (это первая, 7,9 км/с)."],t:[{y:"choice",q:"Какую минимальную скорость нужно сообщить телу, чтобы оно стало спутником Земли?",o:["Первую космическую","Вторую космическую","Третью космическую"],a:0,h:"Для выхода на орбиту вокруг Земли нужна первая космическая скорость.",s:"v₁ ≈ 7,9 км/с."},{y:"input",q:"Чему приблизительно равна вторая космическая скорость для Земли (в км/с)?",a:["11.2","11,2"],h:"Это скорость для преодоления гравитации Земли.",s:"v₂ = 11,2 км/с."},{y:"open",q:"Почему третью космическую скорость выгодно сообщать ракете в направлении движения Земли по орбите?",a:"Чтобы использовать уже имеющуюся орбитальную скорость Земли вокруг Солнца и сэкономить топливо.",h:"Вспомни правило сложения скоростей.",s:"Скорость ракеты относительно Солнца будет равна сумме скорости Земли и скорости ракеты относительно Земли."}]},
{cat:"Гидродинамика",q:"Путаю Бернулли и Торричелли",src:1,e:"<b>Бернулли: p + ρgh + ρv²/2 = const.</b> Уравнение неразрывности: S₁v₁ = S₂v₂. Формула Торричелли: v = √(2gh) для истечения из отверстия.",ex:"В узкой части трубы скорость выше, а давление ниже.",st:["Запиши уравнение неразрывности потока","Запиши уравнение Бернулли для двух сечений","Упрости, если труба горизонтальна (h₁=h₂)"],c:["Проверь единицы: плотность в кг/м³, скорость в м/с","Убедись, что давление в Паскалях"],help:["Уравнение Бернулли — это ЗСМЭ для жидкости.","Пример: если v увеличивается, p должно уменьшиться, чтобы сумма была const.","Частая ошибка: забывать, что формула Торричелли — частный случай Бернулли для открытого сосуда."],t:[{y:"choice",q:"Что происходит с давлением в жидкости, когда скорость её течения по горизонтальной трубе увеличивается?",o:["Увеличивается","Уменьшается","Не меняется"],a:1,h:"Согласно уравнению Бернулли, сумма p и ρv²/2 постоянна.",s:"Если v растёт, ρv²/2 растёт, значит p должно уменьшиться."},{y:"input",q:"Площадь широкой части трубы 10 см², скорость 2 м/с. Чему равна скорость в узкой части площадью 5 см²?",a:["4"],h:"Используй уравнение неразрывности: S₁v₁ = S₂v₂.",s:"10·2 = 5·v₂ ⇒ v₂ = 4 м/с."},{y:"open",q:"Почему скорость истечения воды из отверстия в дне бака не зависит от плотности жидкости?",a:"В формуле Торричелли v = √(2gh) плотность сокращается при приравнивании потенциальной и кинетической энергии.",h:"Запиши ЗСМЭ для капли жидкости: mgh = mv²/2.",s:"Масса m сокращается, остаётся v² = 2gh, откуда v = √(2gh)."}]}

const $=s=>document.querySelector(s),app=$("#app");let S={},F="Все",Q="";
const nz=v=>String(v).toLowerCase().replace(/ё/g,"е").replace(/[−–]/g,"-").replace(/%/g,"").replace(/\s*([\/:+\-=×*])\s*/g,"$1").replace(/\s+/g," ").trim().replace(/,/g,".").replace(/[«»"']/g,"").replace(/[.!?…]+$/,"");
const mix=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const pl=(n,a,b,c)=>n+" "+(n%10==1&&n%100!=11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c);
const N=DATA.reduce((s,d)=>s+(d.t||[]).length,0),CATS=["Все",...new Set(DATA.map(d=>d.cat))];
(()=>{const R=document.documentElement,cs=getComputedStyle(R),x=document.createElement("canvas").getContext("2d"),g=v=>cs.getPropertyValue(v).trim(),lum=c=>{x.fillStyle="#000";x.fillStyle=c;const h=x.fillStyle;if(h[0]!="#")return null;return[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)},cr=(a,b)=>{const p=lum(a),q=lum(b);return p==null||q==null?21:(Math.max(p,q)+.05)/(Math.min(p,q)+.05)},best=(bgs,cur)=>{const m=c=>Math.min(...bgs.map(b=>cr(c,b)));return m(cur)>=4.5?cur:["#1d1a2b","#ffffff"].sort((a,b)=>m(b)-m(a))[0]};R.style.setProperty("--on",best([g("--p")],g("--on")));R.style.setProperty("--t",best(["--s","--o","--l","--v","--g","--in"].map(g),g("--t")));if(cr(g("--p"),g("--s"))<3)R.style.setProperty("--hc",R.style.getPropertyValue("--t"))})();
const hd=()=>`<header><div>🟠 ${TITLE}<br>${CLS}</div><button class="a" data-k="teach">Для учителя ↗</button></header>`;
function home(){S={};app.innerHTML=hd()+`<div class="hero"><h1>${TITLE}</h1><p>${SUB}</p><div class="blob"></div></div>
<div class="bento"><div class="tile or"><small>ТВОЯ БАЗА ЗНАНИЙ ✳</small><h2>Ошибаться можно.<br>Не разобраться — обидно!</h2></div><div class="tile gr"><b>${pl(DATA.length,"тема","темы","тем")}<br>в одном месте</b></div><div class="tile li"><b>${pl(N,"задание","задания","заданий")} ↗</b><p>Проверяй себя сразу</p></div><div class="tile pu wide"><b>Забыл правило? Найдём за минуту ✳</b></div></div>
<h2>Выбери свою ошибку ↗</h2><input id="q" placeholder="Поиск по ошибкам и правилам…" aria-label="Поиск" value="${Q}"><div class="chips">${CATS.map(c=>`<button class="${c==F?"":"a"}" data-k="cat" data-c="${c}">${c}</button>`).join("")}</div><div class="cards" id="L"></div><div class="foot">${TITLE} · ${CLS}</div>`;list();$("#q").oninput=e=>{Q=e.target.value;list()}}
function list(){const v=nz(Q);$("#L").innerHTML=DATA.map((d,i)=>(F=="Все"||d.cat==F)&&nz(d.cat+" "+d.q+" "+d.e+" "+d.ex).includes(v)?`<button class="card" data-k="item" data-i="${i}"><small>№ ${String(i+1).padStart(2,"0")} / ${d.cat}</small>${d.q}<i>↗</i></button>`:"").join("")||"<p>Ничего не нашлось. Попробуй другое слово.</p>"}
function item(i){const d=DATA[i];S={i,hl:1};app.innerHTML=hd()+`<button class="a" data-k="home">← Ко всем темам</button>
<div class="tile pu"><small>${d.cat} · ТЕМА ${i+1}</small><h2>${d.q}</h2></div>
<div class="pan"><h3>01 / Главное правило</h3><p>${d.e}</p><div class="box"><b>Пример:</b> ${d.ex}</div></div>
<div class="pan"><h3>02 / Порядок действий</h3><ol>${d.st.map(x=>`<li>${x}</li>`).join("")}</ol></div>
<div class="pan"><h3>03 / Самопроверка</h3><ul>${d.c.map(x=>`<li>${x}</li>`).join("")}</ul></div>
<div class="pan"><h3>04 / Если не получается</h3><div id="H"></div></div>
${d.t&&d.t.length?`<div class="tile li"><h2>05 / Потренируйся!</h2><div id="T"><p>${pl(d.t.length,"задание","задания","заданий")} с проверкой</p><button data-k="start">Начать ↗</button></div></div>`:""}
<p class="mut">Источник: ${d.src?"правило из учебника, присланное учителем":"общие знания, сверьте с учебником"}.</p>`;help();scrollTo(0,0)}
function help(){const h=DATA[S.i].help;$("#H").innerHTML=h.slice(0,S.hl).map((x,j)=>`<div class="box"><b>Ступень ${j+1}</b><br>${x}</div>`).join("")+(S.hl<h.length?`<button class="a" data-k="more">Ещё подсказка ↗</button>`:`<p>Всё ещё сложно? Спроси учителя или одноклассника и покажи, на каком шаге застрял.</p>`)}
function start(again){const t=DATA[S.i].t;S.list=again?mix(t):t.slice();S.k=0;S.ok=0;task()}
function task(){const t=S.list[S.k];S.tries=0;S.done=0;let h=`<p><b>Задание ${S.k+1} / ${S.list.length}</b></p><h3>${t.q}</h3>`;
if(t.y=="choice")h+=mix(t.o.map((x,j)=>j)).map(j=>`<button class="o" data-k="ch" data-j="${j}">${t.o[j]}</button>`).join("");
else if(t.y=="input")h+=`<input id="A" placeholder="Твой ответ" autocomplete="off"><button data-k="chk">Проверить</button>`;
else h+=`<textarea id="A" rows="3" placeholder="Напиши ответ"></textarea><button data-k="cmp">Сравнить с образцом</button>`;
$("#T").innerHTML=h+`<div id="F"></div>`;const a=$("#A");if(a&&t.y=="input")a.onkeydown=e=>{if(e.key=="Enter")judge(a.value)}}
const fb=(c,m)=>$("#F").innerHTML=`<div class="box ${c}">${m}</div>`;
const next=()=>`<button data-k="next">${S.k+1<S.list.length?"Дальше ↗":"Итог ↗"}</button>`;
function judge(v){const t=S.list[S.k];if(S.done)return;let ok;if(t.y=="choice")ok=+v===t.a;else{v=nz(v);if(!v)return;if(t.n){for(const k in t.n)if(nz(k)==v)return fb("",t.n[k])}ok=t.a.some(x=>nz(x)==v)}
if(ok){if(!S.tries)S.ok++;S.done=1;fb("ok","<b>Верно!</b> "+t.s);$("#F").innerHTML+=next()}
else if(++S.tries<2)fb("no","Не совсем. Подсказка: "+t.h);
else{S.done=1;fb("no",`<b>Правильный ответ:</b> ${t.y=="choice"?t.o[t.a]:t.a[0]}. ${t.s}`);$("#F").innerHTML+=next()}}
function done(){$("#T").innerHTML=`<h2>Готово! ✳</h2><p>С первой попытки: <b>${S.ok} из ${S.list.length}</b></p><button data-k="again">Повторить</button><button class="a" data-k="home">Другие темы</button>`}
function teach(){app.innerHTML=hd()+`<button class="a" data-k="home">← Назад</button><div class="tile pu"><h2>Для учителя ✳</h2><p>Ответы ко всем заданиям</p></div>`+DATA.map((d,i)=>`<div class="pan"><h3>${i+1}. ${d.q}</h3><p class="mut">${d.src?"Правило учителя":"Общие знания — сверьте с учебником"}</p><ol>`+(d.t||[]).map(t=>`<li>${t.q}<br><b>Ответ: ${t.y=="choice"?t.o[t.a]:t.y=="open"?t.a:t.a.join("/")}</b><br><small>${t.s}</small></li>`).join("")+"</ol></div>").join("")}
app.onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k,t=S.list&&S.list[S.k];
if(k=="home")home();if(k=="teach")teach();if(k=="item")item(+b.dataset.i);if(k=="cat"){F=b.dataset.c;home()}if(k=="more"){S.hl++;help()}
if(k=="start")start(0);if(k=="again")start(1);if(k=="ch")judge(b.dataset.j);if(k=="chk")judge($("#A").value);
if(k=="cmp"&&$("#A").value.trim()){S.done=1;$("#F").innerHTML=`<div class="box">Образец: ${t.a}<br>${t.s}</div><button data-k="yes">Совпало</button><button class="a" data-k="no">Не совпало</button>`}
if(k=="yes"||k=="no"){if(k=="yes")S.ok++;$("#F").innerHTML=`<div class="box">Образец: ${t.a}<br>${t.s}</div>`+next()}
if(k=="next"){S.k++;S.k<S.list.length?task():done()}};
home();
</script></body></html>
